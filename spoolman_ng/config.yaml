# Home Assistant Supervisor add-on manifest for Spoolman NG (#89).
# Installation and ingress validated on a live Home Assistant instance; see TESTING.md.
name: Spoolman NG
version: "2026.9.2.1"
slug: spoolman_ng
description: Track your 3D-printer filament spool inventory (community-maintained Spoolman).
url: https://github.com/sherrmann/Spoolman-NG
# Matches the architectures the published image is built for (aarch64 = arm64, armv7 = arm/v7).
arch:
  - amd64
  - aarch64
  - armv7
init: false
ports:
  8000/tcp: 8000
ports_description:
  8000/tcp: Spoolman web UI and REST API
# Home Assistant authenticates and proxies the embedded UI. The ingress listener is
# internal only; port 8000 remains available for printer integrations and direct access.
# Use HA's defaults: ingress port 8099 and an administrator-only sidebar panel.
ingress: true
panel_title: Spoolman NG
panel_icon: mdi:printer-3d
# Defaults to the bundled SQLite database (stored in the add-on's persistent /data volume). Set a
# db_type plus connection details to use an external PostgreSQL/MariaDB/CockroachDB instead.
options:
  db_type: sqlite
schema:
  db_type: "list(sqlite|postgres|mysql|cockroachdb)"
  db_host: "str?"
  db_port: "port?"
  db_name: "str?"
  db_username: "str?"
  db_password: "password?"
  api_token: "password?"
