user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    # WebSocket query strings may contain credentials. Do not log request URLs.
    access_log off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 8099;
        # Home Assistant's ingress gateway is the only trusted caller of this listener.
        allow 172.30.32.2;
        deny all;

        client_max_body_size 0;

        location / {
            # Supervisor has already stripped the session prefix. Keep the URI unchanged
            # and pass its X-Ingress-Path header to Spoolman's per-request renderer.
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Ingress-Path $http_x_ingress_path;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_buffering off;
        }
    }
}
