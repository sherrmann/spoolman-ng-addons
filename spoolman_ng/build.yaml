# Build each architecture's add-on image FROM the matching published Spoolman image. config.yaml
# may add a fourth version component for packaging-only releases; do not add it to this tag.
# The published image is a multi-arch
# manifest, so the same tag resolves to the correct architecture during each per-arch build.
build_from:
  amd64: ghcr.io/sherrmann/spoolman-ng:2026.9.2
  aarch64: ghcr.io/sherrmann/spoolman-ng:2026.9.2
  armv7: ghcr.io/sherrmann/spoolman-ng:2026.9.2
